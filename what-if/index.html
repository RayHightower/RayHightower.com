<style>
  .what-if-wrap {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem 4rem;
    text-align: center;
  }
  .what-if-wrap h1 {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 700;
    margin: 0 0 2.5rem 0;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .what-if-value {
    font-size: clamp(3rem, 10vw, 4.5rem);
    font-weight: 600;
    margin-bottom: 2rem;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .what-if-wrap input[type="range"] {
    width: min(90vw, 420px);
    height: 8px;
    -webkit-appearance: none;
    appearance: none;
    background: #ddd;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }
  .what-if-wrap input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #1a7a4c;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .what-if-wrap input[type="range"]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #1a7a4c;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
</style>

<div class="what-if-wrap">
  <h1>What If?</h1>
  <div class="what-if-value" id="value">50</div>
  <input type="range" id="slider" min="1" max="100" value="50" aria-label="Value from 1 to 100">
</div>

<script>
  const slider = document.getElementById('slider');
  const valueEl = document.getElementById('value');

  function updateValue() {
    valueEl.textContent = slider.value;
  }

  slider.addEventListener('input', updateValue);
  updateValue();
</script>
