<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo-link">
      <img src="/assets/images/RayHightower-logo.svg" alt="RayHightower.com" class="site-logo">
    </a>

    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      ☰
    </button>

    <nav class="main-nav" id="main-nav">
      <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
      <a href="/speaking/" {% if page.url == "/speaking/" %}class="active"{% endif %}>Speaking</a>
      <a href="/books/" {% if page.url == "/books/" or page.url == "/books/index.html" %}class="active"{% endif %}>Books</a>

      <div class="nav-more{% if page.url contains '/blog/' or page.url == '/poetry/' or page.url == '/contact/' %} is-current{% endif %}">
        <span class="nav-more-toggle" aria-haspopup="true">More</span>
        <div class="nav-more-menu">
          <a href="/blog/" {% if page.url contains "/blog/" %}class="active"{% endif %}>Blog</a>
          <a href="/poetry/" {% if page.url == "/poetry/" %}class="active"{% endif %}>Poetry</a>
          <a href="/contact/" {% if page.url == "/contact/" %}class="active"{% endif %}>Contact</a>
        </div>
      </div>

      <a href="/search/" {% if page.url == "/search/" %}class="active"{% endif %}><i class="fa fa-search"></i> Search</a>
    </nav>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.getElementById('main-nav');

    if (toggle && nav) {
      toggle.addEventListener('click', function () {
        const isOpen = nav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', isOpen);
        toggle.textContent = isOpen ? '✕' : '☰';
      });
    }
  });
</script>
