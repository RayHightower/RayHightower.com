<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo-link">
      <img src="/assets/images/RayHightower-logo.png" alt="RayHightower.com" class="site-logo">
    </a>

    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      ☰
    </button>

    <nav class="main-nav" id="main-nav">
      <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
      <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
      <a href="/speaking/" {% if page.url == "/speaking/" %}class="active"{% endif %}>Speaking</a>
      <a href="/archive/" {% if page.url == "/archive/" %}class="active"{% endif %}>Archive</a>
      <a href="/if-rudyard-kipling/" {% if page.url == "/if-rudyard-kipling/" %}class="active"{% endif %}>If</a>
      <a href="/done/" {% if page.url == "/done/" %}class="active"{% endif %}>Done</a>
      <a href="/contact/" {% if page.url == "/contact/" %}class="active"{% endif %}>Contact</a>
      <a href="/search/" {% if page.url == "/search/" %}class="active"{% endif %}>Search</a>
    </nav>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.getElementById('main-nav');

    if (toggle && nav) {
      toggle.addEventListener('click', function () {
        const isOpen = nav.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', isOpen);
        toggle.textContent = isOpen ? '✕' : '☰';
      });
    }
  });
</script>
