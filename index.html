---
layout: default
title: Home
---

<!-- Full-width Hero -->
<section class="hero">
  <div class="hero-media">
    <img src="/assets/images/hero-animation.gif" 
         alt="Ray Hightower – Real Estate Investor, Tech Builder, Speaker"
         class="hero-gif">
  </div>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <p class="hero-subtitle">Real Estate Investor • Tech Builder • Speaker</p>

    <div class="hero-ctas">
      <a href="/about" class="btn btn-secondary">About RayHightower</a>
      <a href="/speaking" class="btn btn-secondary">Speaking</a>
    </div>
  </div>
</section>

<!-- Project Logos (below hero) -->
<section class="project-logos">
  <div class="container">
    <a href="https://roiclear.com" target="_blank" class="logo-item">
      <img src="/assets/images/ROIClear-logo.png" alt="ROIClear">
    </a>
    <a href="https://azmm.org" target="_blank" class="logo-item">
      <img src="/assets/images/AZMM-logo.png" alt="AZMM.org">
    </a>
    <a href="https://roiclear.cashflowportal.com" target="_blank" class="logo-item">
      <img src="/assets/images/investor-portal.png" alt="Investor Portal">
    </a>
  </div>
</section>

<!-- Latest Insights only -->
<section class="section">
  <div class="container">
    <h2>Latest Insights</h2>
    <div class="posts-grid">
      {% for post in paginator.posts limit: 3 %}
      <article class="post-card">
        <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
        <time>{{ post.date | date_to_string }}</time>
        {{ post.excerpt }}
        <a href="{{ post.url }}" class="read-more">Continue reading →</a>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
