# Site settings
title: RayHightower.com
description: Real Estate + Tech = @ROIClear
tagline: Real Estate. Tech. @ROIClear.
baseurl: / # the subpath of your site, e.g. /blog/
url: "https://rayhightower.com" # the base hostname & protocol for your site
permalink: /blog/:year/:month/:day/:title/
excerpt_link: "Continue reading &rarr;"  # "Continue reading" link text at the bottom of excerpted articles
excerpt_separator: <!--more-->
future: true # Let future blog posts be published

# Build settings
markdown: kramdown

# Do not publish repo/handoff notes as site pages
exclude:
  - GROK.md
  - original_about.md
  - README.markdown
  - Gemfile
  - Gemfile.lock
  - vendor

# Google Analytics 4
google_analytics_tracking_id: G-NLV6NZRCK4

# Twitter
twitter_username: rayhightower
twitter_user:
twitter_tweet_button: true

plugins:
  - jekyll-feed
  - jekyll-paginate

feed:
  path: atom.xml
author:
  name: 'Raymond T. Hightower'
  url: https://twitter.com/rayhightower

paginate: 6 # Use an even number because that's how Grok designed the CSS.
paginate_path: "/blog/page:num/"

github_username: rayhightower
github:
  repo: https://github.com/rayhightower